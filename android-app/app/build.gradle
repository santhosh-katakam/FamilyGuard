plugins { id 'com.android.application' }
def local = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { local.load(it) }
def signing = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }
def api = local.getProperty('familyguard.apiUrl', 'https://familyguard-api-REPLACE.onrender.com')
def web = local.getProperty('familyguard.webUrl', 'https://familyguard-REPLACE.onrender.com')
if (!api.startsWith('https://') || !web.startsWith('https://')) throw new GradleException('FamilyGuard requires HTTPS URLs')
android {
 namespace 'com.familyguard.android'
 compileSdk 36
 defaultConfig {
  applicationId 'com.familyguard.android'
  minSdk 26
  targetSdk 36
  versionCode 1
  versionName '1.0.0'
  buildConfigField 'String', 'API_URL', '"' + api + '"'
  buildConfigField 'String', 'WEB_URL', '"' + web + '"'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
 }
 buildFeatures { buildConfig true }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { if(signingFile.exists()) { release { storeFile rootProject.file(signing['storeFile']);storePassword signing['storePassword'];keyAlias signing['keyAlias'];keyPassword signing['keyPassword'] } } }
 buildTypes { release { minifyEnabled false; if(signingFile.exists()) signingConfig signingConfigs.release } }
}
dependencies {
 implementation 'androidx.activity:activity:1.11.0'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 implementation 'androidx.core:core:1.17.0'
 implementation 'androidx.work:work-runtime:2.10.5'
 implementation 'androidx.room:room-runtime:2.8.1'
 annotationProcessor 'androidx.room:room-compiler:2.8.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
}
